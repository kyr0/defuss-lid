<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>defuss-lid · minimal browser example</title>
<!--
  The smallest no-build page: plain module imports relative to the package layout (dist/, models/, runtime/).
  Serve the package folder (e.g. node_modules/defuss-lid, or a checkout after `make setup && make build`) over HTTP and
  open examples/browser.html. The project site in docs/ is the full demo; this file shows the bare API.
-->
<style>
  :root{color-scheme:light dark;font:16px system-ui}body{max-width:760px;margin:48px auto;padding:0 16px}
  label{display:block;margin:20px 0 8px}textarea{box-sizing:border-box;width:100%;min-height:120px;padding:12px;font:inherit}
  button,select{font:inherit;padding:8px}pre{white-space:pre-wrap}
</style>
<h1>Language identification</h1>
<p>Runs locally after loading a model; the text stays in this browser.</p>
<label for="model">Model</label>
<select id="model">
  <option value="fastText-pq-dno/der_3.dlid">der_3 · de, en, ru · fastText (78 kB)</option>
  <option value="fastText-pq-dno/deferi_6.dlid">deferi_6 · de, en, fr, es, ru, it · fastText (127 kB)</option>
  <option value="cld3-pq-dno/major_20.cld3q">major_20 · 20 languages · CLD3 (110 kB)</option>
  <option value="cld3-pq-dno/full.cld3q">full · 109 languages · CLD3 (130 kB)</option>
</select>
<label for="text">Text</label>
<textarea id="text">Das ist ein deutscher Satz.</textarea>
<p><button id="predict">Identify language</button></p>
<pre id="result" aria-live="polite">Ready.</pre>
<p><small>Scores are not calibrated probabilities. A pack answers with one of its own languages, even for text in another one.</small></p>
<script type="module">
  import {loadModel} from '../dist/index.js';
  import {loadCld3Pack} from '../dist/cld3-pack.js';

  const select = document.querySelector('#model'), input = document.querySelector('#text');
  const result = document.querySelector('#result'), button = document.querySelector('#predict');
  let model, loaded;

  button.addEventListener('click', async () => {
    button.disabled = true;
    try {
      if (loaded !== select.value) {
        result.textContent = 'Loading model…';
        const file = select.value, cld3 = file.endsWith('.cld3q');
        const next = await (cld3 ? loadCld3Pack : loadModel)(`../models/${file}`);
        model?.dispose?.(); // CLD3 packs own WebAssembly memory
        [model, loaded] = [next, file];
      }
      const start = performance.now();
      const predictions = model.predict(input.value, {k: loaded.endsWith('.cld3q') ? 1 : 3});
      result.textContent = JSON.stringify({predictions, milliseconds: +(performance.now() - start).toFixed(3)}, null, 2);
    } catch (error) {
      result.textContent = error.message;
    } finally {
      button.disabled = false;
    }
  });
</script>
</html>
