[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "defuss-lid"
version = "0.5.0"
description = "Pretrained language identification compression and portable inference"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.13,<2"]
license = "MIT"

[project.optional-dependencies]
# Native fastText bindings, used only by scripts/verify_native.py for parity checks.
baseline = ["fasttext-wheel==0.9.2"]

[project.scripts]
defuss-lid = "defuss_lid.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-cov>=7,<8",
    # Ruff is pinned to one minor series: formatter output and rule sets change between minors.
    "ruff>=0.17,<0.18",
]

[tool.setuptools.packages.find]
include = ["defuss_lid*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["defuss_lid"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 120
target-version = "py310"
# Python sources only: ruff format would otherwise also rewrite code blocks in Markdown pages,
# which the documentation tooling owns and checks.
include = ["*.py", "*.pyi", "**/pyproject.toml"]
# scripts/ is on sys.path when a script runs, so `from download import ...` is first-party.
src = [".", "scripts"]
# .vae holds the defuss-vae agent tooling's own verifier policy, which that tool owns and formats.
extend-exclude = [".venv", "node_modules", "data", "runs", "work", "reports", "models", ".vae"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "D1"]
ignore = [
    # __init__ arguments are documented in the class docstring.
    "D107",
]

[tool.ruff.lint.per-file-ignores]
# OPENBLAS_NUM_THREADS/OMP_NUM_THREADS must be set before numpy/scipy are first imported.
"scripts/reproduce_v02.py" = ["E402"]
"scripts/reproduce_v03.py" = ["E402"]
